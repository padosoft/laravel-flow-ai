name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'task/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    name: PHP ${{ matrix.php }} / Laravel 13

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']

    steps:
      - name: Checkout laravel-flow-ai
        uses: actions/checkout@v4
        with:
          path: laravel-flow-ai

      # padosoft/laravel-flow is resolved as a normal tagged dependency from
      # Packagist (composer.json requires `^2.0`), so no sibling checkout of
      # core is needed — `composer install` fetches the published release.

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, openssl, pdo, tokenizer, xml, ctype, json, intl
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        working-directory: laravel-flow-ai
        run: composer validate --strict --no-check-publish

      - name: Install dependencies
        working-directory: laravel-flow-ai
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run Pint (style check)
        working-directory: laravel-flow-ai
        run: composer format:test

      - name: Run PHPStan
        working-directory: laravel-flow-ai
        run: composer analyse

      - name: Run PHPUnit suites
        working-directory: laravel-flow-ai
        run: composer test
